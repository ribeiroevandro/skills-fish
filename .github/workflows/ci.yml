name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fish shell
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Validate Fish syntax
        run: fish --no-execute conf.d/*.fish completions/*.fish functions/*.fish tests/*.test.fish

  test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fish shell
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Install fishtape
        run: |
          fish -c "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fishtape"

      - name: Run unit tests
        run: fish -c "fishtape tests/*.test.fish"

  release:
    name: Create Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"* %s (%h)" > changelog.txt
          else
            git log $PREV_TAG..HEAD --pretty=format:"* %s (%h)" > changelog.txt
          fi
          gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --notes-file changelog.txt
